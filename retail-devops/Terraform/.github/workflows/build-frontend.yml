name: Build and Push Frontend

# This tells the robot to wake up ONLY when you push code to the dev-branch inside the frontend folder
on:
  push:
    branches:
      - dev-branch
    paths:
      - 'retail-app/frontend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./retail-app/frontend
          push: true
          tags: glebandkobi/smart-retail-frontend:latest
          