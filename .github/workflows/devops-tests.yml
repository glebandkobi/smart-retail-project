name: Smart Retail CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linting Tool
      run: pip install flake8

    - name: Check Python Code for Errors
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 retail-devops/Python/app.py --count --select=E9,F63,F7,F82 --show-source --statistics

 test-terraform:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Check Terraform Format and Syntax
      run: |
        cd retail-devops/Terraform
        # Checks if code is formatted and parses basic HCL layout syntax cleanly
        terraform fmt -check
